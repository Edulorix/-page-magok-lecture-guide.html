<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>LG Science Park 방문 안내</title>
  <!-- DESIGN SYSTEM & ICONS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Montserrat:wght@500;700&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"/>
  <style>
    /* 스타일 코드 생략... */
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="mb-large">
    <div class="container text-left pt-12 pb-7">
      <h1 class="font-bold text-2xl sm:text-3xl tracking-tight g-brand mb-2">LG Science Park 방문 안내</h1>
      <span class="text-lg text-gray-700" style="font-weight:500;">강사님을 위한 안내 페이지입니다.</span>
    </div>
  </header>
  <main class="container">

    <!-- 1. 링크 생성 및 공유 -->
    <section class="section-card" id="guide-link">
      <div class="section-title"><i class="fas fa-link"></i> 링크 생성 및 공유 안내</div>
      <div class="section-desc">모든 정보를 입력한 뒤, 아래 <span class="g-brand font-bold">링크 생성</span> 버튼을 클릭하면 입력하신 정보로 공유 가능한 링크가 생성됩니다.<br>해당 링크를 <span class="g-brand font-semibold">운영자에게 메일로 전달</span>해주세요.</div>
      <button id="create-link-btn" class="main-btn"><i class="fas fa-link"></i> 링크 생성</button>
    </section>

    <!-- 추가 섹션들 생략 -->

  </main>

  <script>
    // 링크 생성 및 복사 기능
    document.getElementById("create-link-btn").addEventListener("click", function() {
      const companyName = document.getElementById("company-name").value;
      const instructorName = document.getElementById("instructor-name").value;
      const phoneNumber = document.getElementById("phone-number").value;

      // 생성된 링크
      const generatedLink = window.location.origin + window.location.pathname + "?data=" + encodeURIComponent(JSON.stringify({
        company_name: companyName,
        instructor_name: instructorName,
        phone_number: phoneNumber
      }));

      // 클립보드에 복사
      navigator.clipboard.writeText(generatedLink).then(() => {
        alert("링크가 복사되었습니다!");
      });

      // 서버로 데이터 전송 (Java 백엔드와 연동)
      fetch("/saveData", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          company_name: companyName,
          instructor_name: instructorName,
          phone_number: phoneNumber
        })
      })
      .then(response => response.json())
      .then(data => {
        console.log("서버에서 데이터 저장 완료:", data);
      })
      .catch(error => {
        console.error("데이터 전송 오류:", error);
      });
    });
  </script>
</body>
</html>
