<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LG전자 마곡 사이언스파크 강의안내</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .btn-custom {
      @apply bg-blue-500 text-white px-6 py-3 rounded-full shadow-lg transition transform hover:scale-105 hover:bg-blue-600 text-lg font-semibold flex items-center justify-center gap-2;
    }
    .hero-title {
      @apply text-3xl md:text-5xl font-bold text-white mb-4 text-center;
    }
    .hero-sub {
      @apply text-lg md:text-xl text-blue-200 mb-10 text-center;
    }
    .highlight {
      @apply text-yellow-300 font-bold underline underline-offset-4;
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen p-6">
  <main class="text-center">
    <h1 class="hero-title">🎓 <span class="highlight">인정신청</span> 및 <span class="highlight">방문안내</span> 안내 페이지</h1>
    <p class="hero-sub">LG전자 마곡 사이언스파크 강의 운영을 위한 안내 페이지입니다.</p>

    <div class="flex flex-col sm:flex-row justify-center items-center gap-6">
      <a href="application.html" class="btn-custom">
        <i class="fas fa-file-alt"></i> 인정신청 바로가기
      </a>
      <a href="guide.html" class="btn-custom">
        <i class="fas fa-map-marker-alt"></i> 방문안내 바로가기
      </a>
    </div>
  </main>
</body>
</html>
