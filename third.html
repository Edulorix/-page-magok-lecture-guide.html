<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LG전자 마곡 강의안내</title>
  <style>
    :root {
      --primary: #7c3aed;
      --secondary: #3b82f6;
      --text: #f9fafb;
      --bg: #0f172a;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }

    .button-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 1rem 2rem;
      font-size: 1.125rem;
      font-weight: 600;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
    }

    .btn-approve {
      background-color: var(--primary);
      color: white;
    }

    .btn-guide {
      background-color: var(--secondary);
      color: white;
    }

    @media(max-width: 480px) {
      h1 {
        font-size: 2rem;
      }

      .btn {
        font-size: 1rem;
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <h1>LG전자 마곡 사이언스파크</h1>
  <p>강의 안내 페이지에 오신 것을 환영합니다</p>
  <div class="button-row">
    <a href="approve.html" class="btn btn-approve">📚 인정신청</a>
    <a href="guide.html" class="btn btn-guide">🚗 방문안내</a>
  </div>
</body>
</html>
