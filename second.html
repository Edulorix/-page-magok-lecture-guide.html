<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LG Science Park 방문 안내</title>
  <style>
    /* 기본 스타일 */
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f9f9f9; color: #333; margin: 0; padding: 0; }
    h1 { font-size: 48px; font-weight: bold; text-align: center; margin: 40px 0 20px; }
    p { text-align: center; font-size: 18px; color: #666; margin-bottom: 40px; }
    .container { width: 90%; max-width: 800px; margin: auto; }
    .section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 9999px; font-size: 18px; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #5aa0ff; }
    .flex { display: flex; align-items: center; gap: 10px; }
    .wave-effect { position: relative; overflow: hidden; }
    .wave-effect::after { content: ""; position: absolute; background: rgba(255,255,255,0.5); border-radius: 50%; transform: scale(0); animation: ripple 0.6s linear; }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  </style>
</head>

<body>
  <h1>LG Science Park 방문 안내</h1>
  <p>강사님을 위한 안내 페이지입니다.</p>

  <div class="container">
    <div class="section">
      <h2>강사 정보 입력</h2>
      <label>이름</label>
      <input type="text" id="name" placeholder="이름 입력">

      <label>소속</label>
      <input type="text" id="company" placeholder="소속 입력">

      <label>연락처</label>
      <input type="text" id="phone" placeholder="연락처 입력">
    </div>

    <div class="section">
      <h2>반입 장비 리스트</h2>
      <div id="equipment-list"></div>
      <button onclick="addEquipment()">장비 추가 ➕</button>
    </div>

    <div class="section">
      <h2>기타 요청사항</h2>
      <textarea id="requests" rows="4" placeholder="추가 요청사항 입력"></textarea>
    </div>

    <div class="section flex">
      <button onclick="generateLink()" class="wave-effect">링크 생성하기</button>
      <button onclick="copyLink()" class="wave-effect">링크 복사하기</button>
    </div>

    <div class="section">
      <h2>생성된 링크</h2>
      <input type="text" id="generated-link" readonly>
    </div>
  </div>

  <script>
    // 장비 리스트 추가 함수
    function addEquipment() {
      const list = document.getElementById('equipment-list');
      const div = document.createElement('div');
      div.className = 'flex';
      div.innerHTML = `
        <input type="text" placeholder="장비명">
        <input type="text" placeholder="제조사">
        <input type="text" placeholder="MAC 주소">
        <button onclick="this.parentElement.remove()">🗑️ 삭제</button>
      `;
      list.appendChild(div);
    }

    // 링크 생성 함수
    function generateLink() {
      const name = document.getElementById('name').value;
      const company = document.getElementById('company').value;
      const phone = document.getElementById('phone').value;
      const requests = document.getElementById('requests').value;
      let link = `${location.origin}${location.pathname}?name=${encodeURIComponent(name)}&company=${encodeURIComponent(company)}&phone=${encodeURIComponent(phone)}&requests=${encodeURIComponent(requests)}`;
      document.getElementById('generated-link').value = link;
    }

    // 링크 복사 함수
    function copyLink() {
      const link = document.getElementById('generated-link');
      link.select();
      document.execCommand('copy');
      alert('링크가 복사되었습니다!');
    }
  </script>
</body>
</html>
